<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MS Hang Prep — Mark 1:21–45</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800;900&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --paper:#FFFFFF;
    --cream:#EAE6DF;
    --lime:#C3F53C;
    --pink:#F43F5E;
    --blue:#38BDF8;
    --yellow:#FFC72C;
    --purple:#A855F7;

    /* Dynamic gradient presets */
    --bg-lime: linear-gradient(145deg, #d2f860 0%, #a2e014 100%);
    --bg-purple: linear-gradient(145deg, #b862f8 0%, #7e22ce 100%);
    --bg-pink: linear-gradient(145deg, #fb5672 0%, #be123c 100%);
    --bg-dark: linear-gradient(145deg, #262626 0%, #050505 100%);
    --bg-cream: linear-gradient(145deg, #f4f0e8 0%, #d8d2c7 100%);
    --bg-yellow: linear-gradient(145deg, #ffd452 0%, #eab308 100%);
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; width:100%; background:#000; font-family:'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior:none; }
  
  /* FULL-SCREEN RESPONSIVE TV / LARGE DISPLAY CONTAINER */
  .phone{ 
    position:relative; 
    width:100vw; 
    max-width:100%; 
    height:100vh; 
    height:100dvh; 
    margin:0; 
    background:var(--bg-cream); 
    overflow:hidden; 
    display:flex; 
    flex-direction:column; 
    transition:background .4s ease; 
    -webkit-user-select:none; 
    user-select:none; 
    -webkit-touch-callout:none; 
  }
  input, textarea, [contenteditable]{ -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  /* HEADER & CONTINUOUS PROGRESS BAR */
  .hud-header{ 
    position:relative; 
    z-index:50; 
    padding: clamp(14px, 2vh, 28px) clamp(20px, 4vw, 64px) clamp(8px, 1.2vh, 16px) clamp(20px, 4vw, 64px); 
    display:flex; 
    flex-direction:column; 
    gap:clamp(8px, 1.2vh, 14px); 
    width:100%; 
    max-width:1600px; 
    margin:0 auto; 
  }
  .progress-container{ position:relative; width:100%; height:clamp(6px, 1vh, 10px); background:rgba(13,13,29,0.18); border-radius:100px; }
  .tx-light .progress-container{ background:rgba(255,255,255,0.25); }
  .progress-bar-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--ink); border-radius:100px; transition:width .3s cubic-bezier(.2,.8,.25,1); }
  .tx-light .progress-bar-fill{ background:#FFF; }
  
  .notches-layer{ position:absolute; inset:0; pointer-events:none; }
  .prog-notch{ position:absolute; top:50%; transform:translate(-50%, -50%); width:clamp(8px, 1.2vw, 14px); height:clamp(8px, 1.2vw, 14px); border-radius:50%; background:rgba(13,13,29,0.3); border:2px solid rgba(255,255,255,0.6); transition:all .25s ease; }
  .tx-light .prog-notch{ background:rgba(255,255,255,0.4); border-color:rgba(0,0,0,0.3); }
  .prog-notch.passed{ background:var(--lime); border-color:var(--ink); }
  .prog-notch.active{ width:clamp(12px, 1.6vw, 18px); height:clamp(12px, 1.6vw, 18px); background:var(--yellow); border-color:var(--ink); box-shadow:0 0 12px rgba(0,0,0,0.3); animation:notchPulse 1.2s infinite ease-in-out; }
  @keyframes notchPulse{ 0%,100%{ transform:translate(-50%, -50%) scale(1); } 50%{ transform:translate(-50%, -50%) scale(1.25); } }

  .story-meta{ display:flex; justify-content:space-between; font-family:'Space Grotesk', sans-serif; font-size:clamp(12px, 1.4vw, 20px); font-weight:800; letter-spacing:1.5px; text-transform:uppercase; opacity:.85; }

  .stage{ position:relative; flex:1; width:100%; overflow:hidden; z-index:1; perspective:1400px; }
  .beat{ 
    position:absolute; 
    inset:0; 
    display:flex; 
    flex-direction:column; 
    padding: clamp(14px, 2.5vh, 32px) clamp(20px, 4vw, 64px) clamp(16px, 2.5vh, 36px) clamp(20px, 4vw, 64px); 
    opacity:0; 
    transform:translateY(10px) scale(0.98); 
    transition:opacity .25s ease, transform .25s ease; 
    pointer-events:none; 
    z-index:1; 
    width:100%;
    max-width:1600px;
    margin:0 auto;
  }
  .beat.active{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; z-index:2; }
  .tx-dark{ color:var(--ink); }
  .tx-light{ color:#FFF; }

  /* PAGE FLIP TRANSITION */
  .beat.page-flip-out{
    animation: pageFlipOut .6s cubic-bezier(.45,.05,.55,.95) forwards;
    transform-origin: left center;
    backface-visibility: hidden;
    z-index:5 !important;
  }
  @keyframes pageFlipOut{
    0%{ transform:rotateY(0deg); opacity:1; }
    70%{ opacity:1; }
    100%{ transform:rotateY(-100deg); opacity:0; }
  }

  .emoji{ font-size:clamp(46px, 6vw, 90px); line-height:1; margin-bottom:12px; position:relative; z-index:2; }

  /* INTRO SLIDE TYPOGRAPHY HIERARCHY */
  .intro-top-title{ font-family:'Space Grotesk', sans-serif; font-size:clamp(18px, 2.5vw, 36px); font-weight:800; letter-spacing:2px; text-transform:uppercase; opacity:.85; margin-bottom:12px; }
  .intro-duration{ font-family:'Space Grotesk', sans-serif; font-size:clamp(14px, 1.8vw, 24px); font-weight:800; letter-spacing:.5px; text-transform:uppercase; opacity:.7; margin-top:20px; display:flex; align-items:center; gap:12px; }

  .hero-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:2; width:100%; }
  .kline{ overflow:hidden; margin-bottom:4px; }
  .kline:last-child{ margin-bottom:0; }
  .kword{ display:inline-block; opacity:0; transform:translateY(16px) scale(0.92); font-family:'Space Grotesk', sans-serif; font-weight:800; letter-spacing:-0.3px; text-transform:uppercase; }
  .beat.active .kword{ animation:kwIn .5s cubic-bezier(.2,.85,.25,1) forwards; }
  @keyframes kwIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  
  /* TV-SCALE HERO TITLES */
  .hero-title .kword{ font-size:clamp(34px, 6vw, 84px); line-height:1.1; }
  .hero-title.tight .kword{ font-size:clamp(26px, 4.2vw, 56px); line-height:1.15; }
  .hero-title.xl .kword{ font-size:clamp(44px, 9vw, 120px); line-height:1.05; }

  .recap-bullets{ display:flex; flex-direction:column; gap:clamp(10px, 1.8vh, 22px); margin-top:16px; position:relative; z-index:2; }
  .recap-bullet{ font-family:'Inter', sans-serif; font-size:clamp(15px, 1.8vw, 26px); font-weight:800; line-height:1.45; }
  .recap-tag{ display:inline-block; font-family:'Space Grotesk', sans-serif; font-size:clamp(12px, 1.2vw, 18px); font-weight:800; letter-spacing:0.8px; text-transform:uppercase; background:var(--ink); color:#fff; border-radius:8px; padding:4px 12px; margin-right:10px; vertical-align:middle; }
  
  .folder-wrap{ margin-top:16px; display:flex; flex-direction:column; justify-content:flex-start; flex:1; position:relative; z-index:2; width:100%; }
  .folder-tab{ align-self:flex-start; margin-left:12px; background:#E4B563; border:4px solid var(--ink); border-bottom:none; border-radius:12px 12px 0 0; padding:8px 22px 10px 22px; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:clamp(13px, 1.3vw, 20px); letter-spacing:1px; text-transform:uppercase; color:var(--ink); position:relative; z-index:3; margin-bottom:-4px; flex-shrink:0; }
  .folder-body{ display:flex; flex-direction:column; justify-content:space-evenly; background:#F3D48B; border:4px solid var(--ink); border-radius:4px 20px 20px 20px; box-shadow:6px 6px 0 var(--ink); padding:clamp(14px, 2.5vh, 32px) clamp(16px, 3vw, 36px); position:relative; z-index:2; flex-shrink:0; gap:clamp(10px, 1.8vh, 24px); width:100%; }
  .stat-line{ display:flex; gap:16px; align-items:center; font-family:'Inter', sans-serif; font-size:clamp(14.5px, 1.65vw, 24px); font-weight:800; line-height:1.4; padding:4px 0; color:var(--ink); }
  .stat-line .bullet-icon{ font-size:clamp(16px, 1.8vw, 28px); line-height:1; flex-shrink:0; width:clamp(40px, 4.5vw, 64px); height:clamp(40px, 4.5vw, 64px); border-radius:50%; background:var(--ink); color:#F3D48B; display:flex; align-items:center; justify-content:center; }
  .stat-line em{ font-style:normal; color:#B0413E; }

  /* CROSS REFERENCES LAYOUT */
  .rings-bg{ position:absolute; top:-40px; right:-50px; width:clamp(240px, 30vw, 450px); height:clamp(240px, 30vw, 450px); z-index:0; pointer-events:none; }
  .rings-bg span{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); border-radius:50%; border:2px solid rgba(255,255,255,0.12); }
  .rings-bg .r1{ width:100%; height:100%; }
  .rings-bg .r2{ width:75%; height:75%; }
  .rings-bg .r3{ width:50%; height:50%; }
  .rings-bg .r4{ width:25%; height:25%; border-color:rgba(195,245,60,0.35); }

  .xref-compact-list{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:clamp(20px, 4vh, 48px); position:relative; z-index:2; margin-top:12px; width:100%; }
  .xref-item{ display:flex; gap:clamp(16px, 2.5vw, 32px); align-items:center; position:relative; }
  .xref-icon-node{ width:clamp(56px, 6vw, 84px); height:clamp(56px, 6vw, 84px); border-radius:50%; background:var(--lime); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:clamp(22px, 2.5vw, 36px); flex-shrink:0; border:3.5px solid var(--ink); }
  .xref-content{ flex:1; display:flex; flex-direction:column; gap:6px; }
  .xref-meta-line{ display:flex; align-items:baseline; justify-content:flex-start; margin-bottom:2px; }
  .xref-topic{ font-family:'Space Grotesk',sans-serif; font-size:clamp(16px, 1.8vw, 28px); font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--lime); }
  .xref-body{ font-family:'Inter',sans-serif; font-size:clamp(16px, 2vw, 30px); font-weight:700; line-height:1.5; color:rgba(255,255,255,0.92); }
  .xref-body em{ font-style:normal; color:var(--lime); }

  /* SUBTLE NAVIGATION HINTS */
  .tap-hint{ font-family:'Space Grotesk', sans-serif; font-size:clamp(12px, 1.3vw, 18px); font-weight:700; letter-spacing:1px; text-transform:uppercase; opacity:.85; margin-top:auto; text-align:center; padding-top:12px; position:relative; z-index:5; transition:all .2s ease; min-height:36px; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; }
  .swipe-hint{ display:flex; align-items:center; justify-content:center; gap:24px; }
  .swipe-hint i{ font-size:clamp(18px, 2vw, 28px); }
  .swipe-hint .fa-chevron-left{ animation:nudgeLeft 1.6s ease-in-out infinite; }
  .swipe-hint .fa-chevron-right{ animation:nudgeRight 1.6s ease-in-out infinite; }
  @keyframes nudgeLeft{ 0%,100%{ transform:translateX(0); opacity:.45; } 50%{ transform:translateX(-5px); opacity:1; } }
  @keyframes nudgeRight{ 0%,100%{ transform:translateX(0); opacity:.45; } 50%{ transform:translateX(5px); opacity:1; } }

  .nav-subtle-caption{ font-family:'Space Grotesk', sans-serif; font-size:clamp(11px, 1.2vw, 16px); font-weight:700; letter-spacing:.8px; text-transform:uppercase; opacity:.65; margin-top:6px; }

  /* BIBLE DOCK BUTTON */
  .pill-dock-integrated{ width:100%; margin-top:auto; position:relative; z-index:5; padding-top:12px; }
  .focus-pill-dock{ width:100%; border:4px solid var(--ink); border-radius:100px; padding:clamp(14px, 2vh, 22px) 24px; text-align:center; background:rgba(255,255,255,0.45); opacity:.6; box-shadow:4px 4px 0 rgba(13,13,13,0.3); cursor:pointer; transition:background .4s ease, box-shadow .4s ease, border-color .4s ease, color .4s ease; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-size:clamp(16px, 1.8vw, 26px); font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--ink); -webkit-tap-highlight-color:transparent; }
  .focus-pill-dock *{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .focus-pill-dock.ready{ opacity:1; background:var(--lime); box-shadow:5px 5px 0 var(--ink); }
  #vocabPill.ready{ background:var(--yellow); }
  .focus-pill-dock.ready:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .focus-pill-dock.warn{ animation:shakeX .45s; background:var(--yellow) !important; opacity:1 !important; color:var(--ink) !important; border-color:var(--ink) !important; }
  #charPill.warn{ background:var(--lime) !important; }

  /* QUIZ GRIDS */
  .quiz-grid{ display:flex; flex-direction:column; gap:16px; margin-top:16px; position:relative; z-index:2; overflow-y:auto; padding:6px; width:100%; }
  .quiz-grid.fill-grid{ flex:1; }
  .quiz-grid.fill-grid .quiz-tile{ flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; }
  
  .quiz-tile{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:clamp(16px, 1.8vw, 24px); background:#FFF; color:var(--ink); border:4px solid var(--ink); border-radius:20px; padding:clamp(14px, 2vh, 26px) clamp(16px, 2vw, 28px); cursor:pointer; transition:all .13s ease; box-shadow:5px 5px 0 var(--ink); }
  .quiz-tile:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
  .quiz-tile .qt-desc{ display:block; font-family:'Inter',sans-serif; font-size:clamp(13px, 1.3vw, 18px); font-weight:700; opacity:.75; margin-top:6px; text-transform:none; letter-spacing:0; line-height:1.35; }
  .qt-row{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .qt-title{ font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:clamp(17px, 2vw, 26px); }
  .qt-badge-inline{ font-family:'Space Grotesk',sans-serif; font-size:clamp(11px, 1.2vw, 16px); font-weight:800; background:var(--ink); color:#FFF; padding:4px 12px; border-radius:100px; white-space:nowrap; flex-shrink:0; }
  .quiz-tile.correct .qt-badge-inline, .quiz-tile.incorrect .qt-badge-inline{ background:rgba(0,0,0,0.25); }
  .quiz-tile.correct{ background:var(--lime) !important; color:var(--ink) !important; box-shadow:5px 5px 0 var(--ink) !important; }
  .quiz-tile.incorrect{ background:var(--pink) !important; color:#FFF !important; }
  .quiz-tile.locked{ pointer-events:none; }
  @keyframes shakeX{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }
  .quiz-tile.shake{ animation:shakeX .45s; }

  .quiz-tile.testament-tile{ text-align:center; }
  .quiz-tile.testament-tile .qt-title-big{ display:block; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:clamp(24px, 3.2vw, 44px); margin-bottom:12px; }
  .quiz-tile.testament-tile .qt-badge-under{ display:inline-block; font-family:'Space Grotesk',sans-serif; font-size:clamp(12px, 1.4vw, 19px); font-weight:800; background:var(--ink); color:#FFF; padding:8px 18px; border-radius:100px; letter-spacing:.3px; margin-bottom:16px; }
  .quiz-tile.testament-tile.correct .qt-badge-under, .quiz-tile.testament-tile.incorrect .qt-badge-under{ background:rgba(0,0,0,0.3); }
  .quiz-tile.testament-tile .qt-desc-big{ display:block; font-family:'Inter',sans-serif; font-size:clamp(14px, 1.6vw, 22px); font-weight:700; opacity:.85; line-height:1.45; max-width:650px; margin:0 auto; }

  /* HORIZONTAL RESPONSIVE BOXES ON TABLET & TV SIZES */
  @media (min-width: 768px) {
    #questTestamentGrid {
      flex-direction: row !important;
      gap: clamp(20px, 3vw, 40px) !important;
      align-items: stretch !important;
    }
    #questTestamentGrid .quiz-tile {
      flex: 1 1 50% !important;
      padding: clamp(24px, 4vh, 48px) clamp(20px, 2.5vw, 36px) !important;
      justify-content: center !important;
    }
    #questSectionGrid {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: clamp(14px, 2vh, 24px) !important;
    }
    #questSectionGrid .quiz-tile:last-child {
      grid-column: span 2 !important;
    }
  }

  .passage-scroll-wrap{ flex:1; position:relative; min-height:0; display:flex; width:100%; }
  .passage-scroll{ overflow-y:auto; flex:1; padding:4px 20px 4px 0; color:var(--ink); }
  .flow-para{ margin:0 0 20px 0; font-size:clamp(18px, 2.2vw, 32px); line-height:1.65; font-family:'Inter',sans-serif; font-weight:400; }
  .verse-num-inline{ font-family:'Space Grotesk', sans-serif; font-weight:800; color:var(--purple); font-size:.7em; vertical-align:super; margin:0 4px 0 8px; }
  .w{ cursor:pointer; padding:3px 2px; border-radius:4px; transition:background .15s ease; }
  .w-plain{ padding:3px 2px; }
  .w.flagged{ background:var(--yellow); font-weight:900; }

  .review-section-header{ font-family:'Space Grotesk', sans-serif; font-size:clamp(13px, 1.4vw, 20px); font-weight:800; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink); opacity:.8; margin:18px 0 10px 0; display:flex; align-items:center; gap:8px; }
  .review-section-header:first-child{ margin-top:4px; }
  .review-card{ background:#FFF; border:3.5px solid var(--ink); border-radius:16px; padding:clamp(14px, 2vh, 22px) clamp(16px, 2vw, 24px); margin-bottom:12px; font-family:'Inter', sans-serif; font-size:clamp(15px, 1.6vw, 24px); font-weight:700; line-height:1.45; box-shadow:4px 4px 0 var(--ink); color:var(--ink); position:relative; z-index:2; width:100%; }
  .review-card b{ color:var(--purple); text-transform:capitalize; }
  .review-scroll{ flex:1; overflow-y:auto; position:relative; z-index:2; padding:6px; width:100%; }
  .pill-cloud{ display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
  .research-pill{ font-family:'Space Grotesk', sans-serif; font-size:clamp(13px, 1.4vw, 20px); font-weight:800; background:var(--ink); color:#FFF; padding:8px 18px; border-radius:100px; text-transform:capitalize; }

  .verse-pick-list{ overflow-y:auto; flex:1; margin-top:0; position:relative; z-index:2; padding:6px; width:100%; }
  .verse-tile{ display:flex; gap:16px; align-items:flex-start; padding:clamp(12px, 1.6vh, 20px) 16px; cursor:pointer; transition:background .13s ease; color:var(--ink); border-radius:16px; }
  .verse-tile.selected{ background:var(--lime); }
  .verse-tile .vnum{ font-family:'Space Grotesk', sans-serif; font-weight:800; color:var(--purple); flex-shrink:0; width:clamp(28px, 3vw, 44px); font-size:clamp(17px, 2vw, 28px); }
  .verse-tile .vtext{ font-size:clamp(17px, 2vw, 28px); line-height:1.45; font-family:'Inter',sans-serif; font-weight:400; }

  .dark-scripture-card{ background:var(--ink); color:#FFF; border:4px solid var(--ink); border-radius:20px; padding:clamp(16px, 2.5vh, 28px) clamp(20px, 2.5vw, 32px); box-shadow:5px 5px 0 rgba(0,0,0,0.25); flex-shrink:0; position:relative; z-index:2; width:100%; }
  .dark-scripture-card .ref{ font-family:'Space Grotesk', sans-serif; font-size:clamp(13px, 1.4vw, 20px); font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:var(--lime); margin-bottom:6px; }
  .dark-scripture-card .vt{ font-style:normal; font-family:'Inter',sans-serif; font-weight:700; font-size:clamp(15px, 1.7vw, 24px); line-height:1.45; opacity:.95; }

  /* CIRCLE HERO SLIDE */
  .circle-hero-container{ position:relative; z-index:2; flex-shrink:0; display:flex; justify-content:center; align-items:center; margin:clamp(12px, 2.5vh, 28px) 0; width:100%; }
  .circle-hero{ width:clamp(240px, 32vw, 420px); height:clamp(240px, 32vw, 420px); border-radius:50%; background:#FFF; color:var(--ink); border:5px solid var(--ink); box-shadow:8px 8px 0 var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; flex-shrink:0; }
  .circle-hero .arc-stem-text{ font-family:'Space Grotesk', sans-serif; font-size:clamp(12px, 1.3vw, 18px); font-weight:800; text-transform:uppercase; letter-spacing:1.2px; opacity:.7; margin-bottom:8px; }
  .circle-hero .label-god-is{ font-family:'Space Grotesk', sans-serif; font-weight:900; font-size:clamp(24px, 3.2vw, 44px); letter-spacing:-.5px; text-transform:uppercase; line-height:1; margin-bottom:14px; }
  .blank-input{ width:88%; max-width:88%; border:none; border-bottom:4px solid var(--ink); background:transparent; font-family:'Inter', sans-serif; font-size:clamp(18px, 2.4vw, 32px); font-weight:800; text-align:center; outline:none; color:var(--purple); padding:4px 0; transition:all .2s ease; }
  .blank-input.ghost{ color:rgba(13,13,29,.35); font-style:italic; }

  .inline-tip{ margin-top:10px; margin-bottom:6px; position:relative; z-index:2; flex-shrink:0; color:var(--ink); opacity:0; transform:translateY(6px); transition:all .25s ease; width:100%; }
  .inline-tip.show{ opacity:1; transform:translateY(0); }

    }).join(' ');
    return `<div class="kline">${words}</div>`;
  }).join('');
  return `<div class="hero-title${extraClass ? ' '+extraClass : ''}">${body}</div>`;
}

const paragraphEnds = [28, 31, 34, 39, 44, 45];

function passageWordsHTML(){
  let out = '<p class="flow-para">';
  passage.forEach((v,i)=>{
    const verseNum = i + 21;
    const words = v.replace(/—(?=\S)/g, '— ').split(/\s+/);
    const normed = words.map(normWord);
    const pieces = [];
    let wi = 0;
    while (wi < words.length) {
      const marker = wi === 0 ? `<span class="verse-num-inline">${verseNum}</span>` : '';
      const match = phrases.find(p => p.words.every((pw,k) => normed[wi+k] === pw));
      if (match) {
        const span = words.slice(wi, wi + match.words.length).join(' ');
        pieces.push(`${marker}<span class="w" data-word="${match.key}" onclick="tapWord(event,this)">${span}</span>`);
        wi += match.words.length;
        continue;
      }
      const norm = normed[wi];
      pieces.push(`${marker}<span class="w" data-word="${norm}" onclick="tapWord(event,this)">${words[wi]}</span>`);
      wi++;
    }
    out += pieces.join(' ') + ' ';
    if (paragraphEnds.includes(verseNum) && verseNum !== 45) out += '</p><p class="flow-para">';
  });
  out += '</p>';
  return out;
}

const sectionLabels = [
  'Dwell Guide', 'Discover Context', 'Discover Context', 'Discover Context',

function initNotches(){
  const layer = document.getElementById('notchesLayer');
  layer.innerHTML = '';
  const total = beats.length;
  beats.forEach((b, i) => {
    if (b.isInteractive) {
      const notch = document.createElement('div');
      notch.className = 'prog-notch';
      notch.id = `notch-${i}`;
      const pct = (i / (total - 1)) * 100;
      notch.style.left = `${pct}%`;
      layer.appendChild(notch);
    }
  });
}

function updateProgressBar(){
  const fill = document.getElementById('progressBarFill');
  const total = beats.length;
  const pct = (state.index / (total - 1)) * 100;
  fill.style.width = `${pct}%`;

  beats.forEach((b, i) => {
    if (b.isInteractive) {
      const notch = document.getElementById(`notch-${i}`);
      if (!notch) return;
      notch.classList.remove('passed', 'active');
      if (state.index > i) {
        notch.classList.add('passed');
      } else if (state.index === i) {
        notch.classList.add('active');
      }
    }
  });
}

const stage = document.getElementById('stage');
const phoneEl = document.getElementById('phone');
beats.forEach((b,i)=>{
  const div=document.createElement('div');
  div.className = `beat ${b.text === 'light' ? 'tx-light' : 'tx-dark'}`;
  div.id = `beat-${i}`;
  div.style.background = b.bgGrad;
  div.innerHTML = b.html;
  stage.appendChild(div);
});

let clueTimeout = null;

function triggerSelectionClue(){
  const b = beats[state.index];
  
  if (b.id === 'vocab-scan') {
    const pill = document.getElementById('vocabPill');
    const txt = document.getElementById('vocabPillText');
    if (pill && txt) {
      pill.classList.add('warn');
      txt.textContent = state.wordTaps.length === 0 ? 'Flag a word to continue!' : 'Scroll to the bottom!';
      setTimeout(() => { pill.classList.remove('warn'); updateWordUI(); }, 1800);
      return;
    }
  }

  if (b.id === 'char-verse-pick') {
    const pill = document.getElementById('charPill');
    const txt = document.getElementById('charPillText');
    if (pill && txt) {
      pill.classList.add('warn');
      txt.textContent = 'Tap a verse to select!';
      setTimeout(() => { pill.classList.remove('warn'); updateCharPill(); }, 1800);
      return;
    }
  }

  const activeBeatEl = document.getElementById(`beat-${state.index}`);
  const hintBox = activeBeatEl ? activeBeatEl.querySelector('.tap-hint') : null;
  if (!hintBox) return;

  const clueText = b.clue || 'Make a selection';
  hintBox.innerHTML = `<span class="clue-badge"><i class="fa-solid fa-hand-pointer"></i> ${clueText}</span>`;

  clearTimeout(clueTimeout);
  clueTimeout = setTimeout(() => {
    resetArrows();
  }, 2000);
}

function resetArrows(){
  const activeBeatEl = document.getElementById(`beat-${state.index}`);
  const hintBox = activeBeatEl ? activeBeatEl.querySelector('.tap-hint') : null;
  if (!hintBox) return;

  if (state.index === 0) {
    hintBox.innerHTML = `<div class="swipe-hint"><i class="fa-solid fa-chevron-left"></i><i class="fa-solid fa-chevron-right"></i></div>
    <div class="nav-subtle-caption">Swipe to navigate</div>`;
  } else {
    hintBox.innerHTML = `<div class="swipe-hint"><i class="fa-solid fa-chevron-left"></i><i class="fa-solid fa-chevron-right"></i></div>`;
  }
}

function renderBeat(i){
  document.querySelectorAll('.beat').forEach(el=>el.classList.remove('active'));
  document.getElementById(`beat-${i}`).classList.add('active');
  renderGen++;
  stopGhostCycle();
  const b = beats[i];

  phoneEl.style.background = b.bgGrad;
  document.querySelector('.hud-header').className = 'hud-header ' + (b.text === 'light' ? 'tx-light' : 'tx-dark');
  document.getElementById('sectionLabel').textContent = sectionLabels[i] || '';

  resetArrows();

  if (b.id === 'char-coaching') {
    const activeVerse = state.charVerse || 21;
    document.getElementById('charRef').textContent = 'Mark 1:' + activeVerse;
    document.getElementById('charText').textContent = quoteVerse(passage[activeVerse-21]);

    const arcStem = document.getElementById('arcStemText');
    if (arcStem) arcStem.textContent = `BASED ON VERSE ${activeVerse}:`;

    const coachText = document.getElementById('coachBoxText');
    if (coachText) coachText.innerHTML = `<b>TIP:</b> Have students look down at verse ${activeVerse} and share what they think it reveals about God's character. Silence is okay, give it 7 seconds before jumping in.`;

    const inp = document.getElementById('customTraitInput');
    if (inp) {
      if (state.trait && state.trait.trim()) {
        inp.value = state.trait;
        inp.classList.remove('ghost');
        stopGhostCycle();
      } else {
        inp.value = 'e.g. ' + ghostExamples[0];
        inp.classList.add('ghost');
        startGhostCycle();
      }
    }
    document.getElementById('coachBox').classList.toggle('show', !!(state.trait && state.trait.trim()));
  } else if (b.id === 'char-verse-pick') {
    document.querySelectorAll('#beat-'+i+' .verse-tile').forEach(t=>t.classList.toggle('selected', state.charVerse !== null && Number(t.dataset.v)===state.charVerse));
    updateCharPill();
  } else if (b.id === 'vocab-scan') {
    updateWordUI();
    checkPassageScroll();
  }

  if (b.id === 'final') fillFinal();
  if (b.id === 'vocab-review') renderVocabReview();

  updateProgressBar();
}

const answeredBeats = new Set();

function questAnswer(e, el, gridId){
  e.stopPropagation();
  if (el.classList.contains('locked')) return;
  const isCorrect = el.dataset.correct === 'true';
  if (isCorrect) {
    const grid = document.getElementById(gridId);
    grid.querySelectorAll('.quiz-tile').forEach(t=>t.classList.add('locked'));
    el.classList.add('correct');
    answeredBeats.add(state.index);
    const myGen = renderGen;
    setTimeout(()=>{ if (renderGen === myGen) goNext(); }, 600);
  } else {
    el.classList.add('incorrect','shake');
    setTimeout(()=>{ el.classList.remove('shake','incorrect'); }, 500);
  }
}

function tapWord(e, el){
  e.stopPropagation();
  const key = el.dataset.word;
  if (!key) return;
  const word = el.textContent.trim().replace(/^[^A-Za-z']+/, '').replace(/[^A-Za-z']+$/, '');
  const already = el.classList.contains('flagged');
  if (already) {
    el.classList.remove('flagged');
    state.wordTaps = state.wordTaps.filter(w => w.el !== el);
  } else {
    const def = defs[key] || null;
    const isStop = stopWords.has(key);
    el.classList.add('flagged');
    state.wordTaps.push({ el, word, def, isStop });
  }
  updateWordUI();
}

function updateWordUI(){ checkVocabComplete(); }

function checkVocabComplete(){
  const pill = document.getElementById('vocabPill');
  const textEl = document.getElementById('vocabPillText');
  if (!pill || !textEl) return;
  const n = state.wordTaps.length;
  const hasWord = n > 0;
  const ready = hasWord && state.scrolledToEnd;
  pill.classList.toggle('ready', ready);
  if (ready) {
    textEl.innerHTML = '<i class="fa-solid fa-check"></i> Continue';
  } else {
    textEl.textContent = n > 0 ? `${n} word${n===1?'':'s'} flagged` : 'Flag Key Words';
  }
}

function tryAdvanceVocab(){
  if (state.wordTaps.length > 0 && state.scrolledToEnd) goNext();
  else triggerSelectionClue();
}

function checkPassageScroll(){
  const el = document.getElementById('passageScrollEl');
  const hint = document.getElementById('scrollMoreHint');
  if (!el) return;
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
  if (atBottom && !state.scrolledToEnd) {
    state.scrolledToEnd = true;
    checkVocabComplete();
  }
  if (hint) hint.classList.toggle('hide', atBottom);
}

function renderVocabReview(){
  const box = document.getElementById('vocabReviewBox');
  if (state.wordTaps.length === 0) {
    box.innerHTML = `<div class="review-card">No words flagged!</div>`;
    return;
  }
  const defined = state.wordTaps.filter(w => w.def);
  const undefinedWords = state.wordTaps.filter(w => !w.def);
  
  let html = '';
  if (defined.length > 0) {
    html += `<div class="review-section-header"><i class="fa-solid fa-book-bookmark"></i> Defined Terms</div>`;
    html += defined.map(w => `<div class="review-card"><b>${w.word}:</b> ${w.def}</div>`).join('');
  }
  if (undefinedWords.length > 0) {
    html += `<div class="review-section-header"><i class="fa-solid fa-magnifying-glass"></i> Terms to Define Before Sunday</div>
             <div class="pill-cloud">${undefinedWords.map(w => `<div class="research-pill">${w.word}</div>`).join('')}</div>`;
  }
  box.innerHTML = html;
}

function pickCharVerse(e, v){
  e.stopPropagation();
  state.charVerse = v;
  document.querySelectorAll('.verse-tile').forEach(t=>t.classList.toggle('selected', Number(t.dataset.v)===v));
  updateCharPill();
}

function updateCharPill(){
  const pill = document.getElementById('charPill');
  const textEl = document.getElementById('charPillText');
  if (!pill || !textEl) return;
  const ready = state.charVerse !== null;
  pill.classList.toggle('ready', ready);
  if (ready) {
    textEl.innerHTML = '<i class="fa-solid fa-check"></i> Continue';
  } else {
    textEl.textContent = "Spot a God Shot";
  }
}

function tryAdvanceChar(){
  if (state.charVerse !== null) goNext();
  else triggerSelectionClue();
}

const ghostExamples = ['Holy', 'Love', 'King'];
let ghostCycleTimer = null;
let ghostCycleIndex = 0;

function startGhostCycle(){
  stopGhostCycle();
  ghostCycleIndex = 0;
  const myGen = renderGen;
  ghostCycleTimer = setInterval(()=>{
    if (renderGen !== myGen) { stopGhostCycle(); return; }
    const inp = document.getElementById('customTraitInput');
    if (!inp || !inp.classList.contains('ghost')) { stopGhostCycle(); return; }
    ghostCycleIndex = (ghostCycleIndex + 1) % ghostExamples.length;
    inp.value = 'e.g. ' + ghostExamples[ghostCycleIndex];
  }, 2200);
}

function stopGhostCycle(){
  if (ghostCycleTimer) { clearInterval(ghostCycleTimer); ghostCycleTimer = null; }
}

function handleBlankFocus(inp){
  if (inp.classList.contains('ghost')) {
    inp.value = '';
    inp.classList.remove('ghost');
    stopGhostCycle();
  }
}

function handleCustomTrait(val){
  state.trait = val;
  const box = document.getElementById('coachBox');
  const hasContent = !!(val && val.trim());
  if (box) box.classList.toggle('show', hasContent);
}

function fillFinal(){
  const list = document.getElementById('finalWords');
  if (state.wordTaps.length === 0) {
    list.innerHTML = `<div class="word-chip">No words flagged.</div>`;
  } else {
    const limitedTaps = state.wordTaps.slice(0, 3);
    list.innerHTML = limitedTaps.map(w=>{
      const d = w.def || 'Look up definition before group.';
      return `<div class="word-chip"><b>${w.word}</b> — ${d}</div>`;
    }).join('');
  }
  
  const fv = document.getElementById('finalVerse');
  if (state.charVerse) {
    fv.innerHTML = `<b>Mark 1:${state.charVerse}</b> — ${quoteVerse(passage[state.charVerse-21])}`;
  } else {
    fv.textContent = 'No verse selected.';
  }
  
  const trait = state.trait && state.trait.trim() ? state.trait.trim() : 'Holy';
  const appStmt = document.getElementById('finalAppStatement');
  if (appStmt) {
    appStmt.innerHTML = `God is <b>${trait}</b>. Therefore, I ________.`;
  }
}

function goNext(){
  const b = beats[state.index];
  if (b.blockTap) {
    if ((b.id === 'quest-testament' || b.id === 'quest-section') && !answeredBeats.has(state.index)) {
      triggerSelectionClue();
      return;
    }
    if (b.id === 'vocab-scan' && (!state.wordTaps.length || !state.scrolledToEnd)) {
      triggerSelectionClue();
      return;
    }
    if (b.id === 'char-verse-pick' && state.charVerse === null) {
      triggerSelectionClue();
      return;
    }
    if (b.id === 'char-coaching' && !(state.trait && state.trait.trim())) {
      triggerSelectionClue();
      return;
    }
  }
  if (state.index < beats.length - 1) {
    const nextBeat = beats[state.index + 1];
    const isFlipPair = (b.id === 'reading-intro' && nextBeat.id === 'vocab-scan') ||
                        (b.id === 'character-prompt' && nextBeat.id === 'char-verse-pick');
    if (isFlipPair) {
      const curEl = document.getElementById('beat-' + state.index);
      if (curEl) {
        curEl.classList.add('page-flip-out');
        setTimeout(()=>{ curEl.classList.remove('page-flip-out'); }, 650);
      }
    }
    state.index++; renderBeat(state.index);
  }
}

function goPrev(){ if (state.index > 0) { state.index--; renderBeat(state.index); } }

/* KEYBOARD NAVIGATION */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
});

/* SWIPE + TAP-ZONE NAVIGATION */
const NAV_EXCLUDE = '.quiz-tile, .verse-tile, .w, .w-plain, .flow-para, .focus-pill-dock, button, input, textarea, a, .breath-visual';
let lastGestureTime = 0;

function tapZoneNav(clientX){
  const rect = stageEl.getBoundingClientRect();
  const relX = clientX - rect.left;
  if (relX < rect.width * 0.32) goPrev();
  else goNext();
}

let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
const stageEl = document.getElementById('stage');

stageEl.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
}, { passive: true });

stageEl.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;

  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 500) {
    lastGestureTime = Date.now();
    if (dx < 0) goNext();
    else goPrev();
  } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && dt < 400) {
    if (e.target.closest(NAV_EXCLUDE)) return;
    lastGestureTime = Date.now();
    tapZoneNav(t.clientX);
  }
}, { passive: true });

let mouseStartX = 0, mouseStartY = 0, mouseIsDown = false, mouseDidDrag = false;

stageEl.addEventListener('mousedown', (e) => {
  if (['INPUT', 'BUTTON', 'TEXTAREA'].includes(e.target.tagName) || e.target.closest(NAV_EXCLUDE)) return;
  mouseIsDown = true;
  mouseDidDrag = false;
  mouseStartX = e.clientX;
  mouseStartY = e.clientY;
});

stageEl.addEventListener('mouseup', (e) => {
  if (!mouseIsDown) return;
  mouseIsDown = false;
  const dx = e.clientX - mouseStartX;
  const dy = e.clientY - mouseStartY;

  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    mouseDidDrag = true;
    lastGestureTime = Date.now();
    if (dx < 0) goNext();
    else goPrev();
  } else if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
    mouseDidDrag = true;
  }
});

stageEl.addEventListener('click', (e) => {
  if (mouseDidDrag) { mouseDidDrag = false; return; }
  if (Date.now() - lastGestureTime < 500) return;
  if (e.target.closest(NAV_EXCLUDE)) return;
  tapZoneNav(e.clientX);
});

        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      } catch (downloadErr) {
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      }
    }, 'image/png');
  } catch(err){ alert('Export failed. Please take a screenshot instead.'); }
}

const passageScrollElInit = document.getElementById('passageScrollEl');
if (passageScrollElInit) passageScrollElInit.addEventListener('scroll', checkPassageScroll, { passive: true });

initNotches();
renderBeat(0);
</script>
