<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MS Hang Prep — Mark 1:21–45</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --paper:#FFFFFF;
    --cream:#EAE6DF;
    --lime:#C3F53C;
    --pink:#F43F5E;
    --blue:#38BDF8;
    --yellow:#FFC72C;
    --purple:#A855F7;

    /* Dynamic gradient presets */
    --bg-lime: linear-gradient(145deg, #d2f860 0%, #a2e014 100%);
    --bg-purple: linear-gradient(145deg, #b862f8 0%, #7e22ce 100%);
    --bg-pink: linear-gradient(145deg, #fb5672 0%, #be123c 100%);
    --bg-dark: linear-gradient(145deg, #262626 0%, #050505 100%);
    --bg-cream: linear-gradient(145deg, #f4f0e8 0%, #d8d2c7 100%);
    --bg-yellow: linear-gradient(145deg, #ffd452 0%, #eab308 100%);
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; background:#000; font-family:'Inter', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior:none; }
  .phone{ position:relative; width:100%; max-width:430px; height:100vh; height:100dvh; margin:0 auto; background:var(--bg-cream); overflow:hidden; box-shadow:0 0 60px rgba(0,0,0,0.5); display:flex; flex-direction:column; transition:background .4s ease; }
  @media (min-width:431px){ body{ display:flex; align-items:center; justify-content:center; } .phone{ height:90vh; height:90dvh; border-radius:36px; border:4px solid #FFF; } }

  /* HEADER & CONTINUOUS PROGRESS BAR */
  .hud-header{ position:relative; z-index:50; padding:16px 18px 6px 18px; display:flex; flex-direction:column; gap:8px; }
  .progress-container{ position:relative; width:100%; height:6px; background:rgba(13,13,29,0.18); border-radius:100px; }
  .tx-light .progress-container{ background:rgba(255,255,255,0.25); }
  .progress-bar-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--ink); border-radius:100px; transition:width .3s cubic-bezier(.2,.8,.25,1); }
  .tx-light .progress-bar-fill{ background:#FFF; }
  
  .notches-layer{ position:absolute; inset:0; pointer-events:none; }
  .prog-notch{ position:absolute; top:50%; transform:translate(-50%, -50%); width:8px; height:8px; border-radius:50%; background:rgba(13,13,29,0.3); border:1.5px solid rgba(255,255,255,0.6); transition:all .25s ease; }
  .tx-light .prog-notch{ background:rgba(255,255,255,0.4); border-color:rgba(0,0,0,0.3); }
  .prog-notch.passed{ background:var(--lime); border-color:var(--ink); }
  .prog-notch.active{ width:11px; height:11px; background:var(--yellow); border-color:var(--ink); box-shadow:0 0 8px rgba(0,0,0,0.3); animation:notchPulse 1.2s infinite ease-in-out; }
  @keyframes notchPulse{ 0%,100%{ transform:translate(-50%, -50%) scale(1); } 50%{ transform:translate(-50%, -50%) scale(1.25); } }

  .story-meta{ display:flex; justify-content:space-between; font-family:'Space Grotesk', sans-serif; font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; opacity:.8; }

  .stage{ position:relative; flex:1; overflow:hidden; z-index:1; perspective:1400px; }
  .beat{ position:absolute; inset:0; display:flex; flex-direction:column; padding:16px 20px 20px 20px; opacity:0; transform:translateY(10px) scale(0.98); transition:opacity .25s ease, transform .25s ease; pointer-events:none; z-index:1; }
  .beat.active{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; z-index:2; }
  .tx-dark{ color:var(--ink); }
  .tx-light{ color:#FFF; }

  /* PAGE FLIP TRANSITION */
  .beat.page-flip-out{
    animation: pageFlipOut .6s cubic-bezier(.45,.05,.55,.95) forwards;
    transform-origin: left center;
    backface-visibility: hidden;
    z-index:5 !important;
  }
  @keyframes pageFlipOut{
    0%{ transform:rotateY(0deg); opacity:1; }
    70%{ opacity:1; }
    100%{ transform:rotateY(-100deg); opacity:0; }
  }

  .kicker{ font-family:'Space Grotesk', sans-serif; font-size:12.5px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; opacity:.8; margin-bottom:6px; position:relative; z-index:2; }
  .emoji{ font-size:42px; line-height:1; margin-bottom:6px; position:relative; z-index:2; }

  /* INTRO SLIDE TYPOGRAPHY HIERARCHY */
  .intro-top-title{ font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:.85; margin-bottom:12px; }
  .intro-duration{ font-family:'Space Grotesk', sans-serif; font-size:13.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; opacity:.6; margin-top:16px; display:flex; align-items:center; gap:8px; }

  .hero-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; position:relative; z-index:2; }
  .kline{ overflow:hidden; }
  .kword{ display:inline-block; opacity:0; transform:translateY(16px) scale(0.92); font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:-1.5px; text-transform:uppercase; }
  .beat.active .kword{ animation:kwIn .5s cubic-bezier(.2,.85,.25,1) forwards; }
  @keyframes kwIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
  .hero-title .kword{ font-size:clamp(36px, 13vw, 56px); line-height:0.95; }
  .hero-title.tight .kword{ font-size:clamp(28px, 10vw, 42px); }
  .hero-title.xl .kword{ font-size:clamp(42px, 15vw, 66px); line-height:0.95; }

  .sub{ font-family:'Inter', sans-serif; font-size:16px; font-weight:800; line-height:1.4; opacity:.94; margin-top:14px; position:relative; z-index:2; }
  .folder-wrap{ margin-top:18px; display:flex; flex-direction:column; flex:1; position:relative; z-index:2; }
  .folder-tab{ align-self:flex-start; margin-left:8px; background:#E4B563; border:3.5px solid var(--ink); border-bottom:none; border-radius:10px 10px 0 0; padding:7px 20px 10px 20px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink); position:relative; z-index:3; margin-bottom:-4px; }
  .folder-body{ flex:1; display:flex; flex-direction:column; justify-content:center; background:#F3D48B; border:3.5px solid var(--ink); border-radius:3px 16px 16px 16px; box-shadow:5px 5px 0 var(--ink); padding:6px 22px; position:relative; z-index:2; }
  .stat-line{ display:flex; gap:18px; align-items:center; font-family:'Inter', sans-serif; font-size:14px; font-weight:800; line-height:1.45; padding:16px 0; border-bottom:2px dashed rgba(13,13,29,0.25); color:var(--ink); }
  .stat-line:last-child{ border-bottom:none; }
  .stat-line .bullet-icon{ font-size:19px; line-height:1; flex-shrink:0; width:44px; height:44px; border-radius:50%; background:var(--ink); color:#F3D48B; display:flex; align-items:center; justify-content:center; }
  .stat-line em{ font-style:normal; color:#B0413E; }

  /* SUBTLE NAVIGATION HINTS */
  .tap-hint{ font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; opacity:.85; margin-top:auto; text-align:center; padding-top:10px; position:relative; z-index:2; transition:all .2s ease; min-height:36px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .swipe-hint{ display:flex; align-items:center; justify-content:center; gap:22px; }
  .swipe-hint i{ font-size:18px; }
  .swipe-hint .fa-chevron-left{ animation:nudgeLeft 1.6s ease-in-out infinite; }
  .swipe-hint .fa-chevron-right{ animation:nudgeRight 1.6s ease-in-out infinite; }
  @keyframes nudgeLeft{ 0%,100%{ transform:translateX(0); opacity:.45; } 50%{ transform:translateX(-5px); opacity:1; } }
  @keyframes nudgeRight{ 0%,100%{ transform:translateX(0); opacity:.45; } 50%{ transform:translateX(5px); opacity:1; } }

  .nav-subtle-caption{ font-family:'Space Grotesk', sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; opacity:.65; margin-top:4px; }

  /* BIBLE DOCK BUTTON (OPAQUE UNTIL COMPLETED) */
  .pill-dock-integrated{ width:100%; margin-top:auto; position:relative; z-index:5; }
  .focus-pill-dock{ width:100%; border:3.5px solid var(--ink); border-radius:100px; padding:12px 18px; text-align:center; background:rgba(255,255,255,0.45); opacity:.6; box-shadow:3px 3px 0 rgba(13,13,13,0.3); cursor:pointer; transition:all .22s ease; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--ink); }
  .focus-pill-dock.ready{ opacity:1; background:var(--lime); box-shadow:4px 4px 0 var(--ink); }
  .focus-pill-dock.ready:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .focus-pill-dock.warn{ animation:shakeX .45s; background:var(--yellow) !important; opacity:1 !important; color:var(--ink) !important; border-color:var(--ink) !important; }

  .quiz-grid{ display:flex; flex-direction:column; gap:11px; margin-top:6px; position:relative; z-index:2; overflow-y:auto; padding:2px 8px 8px 2px; }
  .quiz-tile{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; background:#FFF; color:var(--ink); border:3.5px solid var(--ink); border-radius:16px; padding:13px 15px; cursor:pointer; transition:all .13s ease; box-shadow:4px 4px 0 var(--ink); }
  .quiz-tile:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
  .quiz-tile .qt-desc{ display:block; font-family:'Inter',sans-serif; font-size:11.5px; font-weight:700; opacity:.7; margin-top:3px; text-transform:none; letter-spacing:0; }
  .quiz-tile.correct{ background:var(--lime) !important; color:var(--ink) !important; box-shadow:4px 4px 0 var(--ink) !important; }
  .quiz-tile.incorrect{ background:var(--pink) !important; color:#FFF !important; }
  .quiz-tile.locked{ pointer-events:none; }
  @keyframes shakeX{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }
  .quiz-tile.shake{ animation:shakeX .45s; }

  .feedback-box{ font-family:'Inter', sans-serif; font-size:13px; font-weight:800; margin-top:10px; padding:11px 13px; border-radius:14px; opacity:0; transition:opacity .15s ease; position:relative; z-index:2; flex-shrink:0; background:#FFF; color:var(--ink); border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink); min-height:64px; box-sizing:border-box; }
  .feedback-box.show{ opacity:1; }
  .feedback-box.good{ background:var(--lime); }
  .feedback-box.bad{ background:var(--pink); color:#FFF; }

  .passage-scroll-wrap{ flex:1; position:relative; min-height:0; display:flex; }
  .read-progress-track{ position:absolute; top:0; left:0; right:0; height:4px; background:rgba(13,13,29,0.12); z-index:4; border-radius:2px; overflow:hidden; }
  .read-progress-fill{ height:100%; width:0%; background:var(--yellow); border-radius:2px; }
  .def-popover{ position:absolute; z-index:50; max-width:230px; background:var(--ink); color:#FFF; font-family:'Inter',sans-serif; font-size:12.5px; font-weight:700; line-height:1.4; padding:10px 12px; border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,0.35); opacity:0; pointer-events:none; transform:translateY(4px); transition:opacity .15s ease, transform .15s ease; }
  .def-popover.show{ opacity:1; transform:translateY(0); }
  .def-popover .dp-word{ display:block; font-family:'Space Grotesk',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--lime); font-size:11px; margin-bottom:3px; }
  .passage-scroll{ overflow-y:auto; flex:1; padding:16px 4px 4px 0; color:var(--ink); }
  .flow-para{ margin:0 0 16px 0; font-size:16.5px; line-height:1.65; font-family:'Inter',sans-serif; font-weight:700; }
  .verse-num-inline{ font-family:'Space Grotesk', sans-serif; font-weight:700; color:var(--purple); font-size:.65em; vertical-align:super; margin:0 2px 0 6px; }
  .w{ cursor:pointer; border-bottom:2px dotted rgba(13,13,13,0.35); padding:2px 1px; border-radius:3px; }
  .w.flagged{ background:var(--yellow); border-bottom-color:transparent; font-weight:900; }

  .review-card{ background:#FFF; border:3px solid var(--ink); border-radius:14px; padding:12px 14px; margin-bottom:10px; font-family:'Inter', sans-serif; font-size:13.5px; font-weight:700; line-height:1.4; box-shadow:3px 3px 0 var(--ink); color:var(--ink); position:relative; z-index:2; }
  .review-card b{ color:var(--purple); text-transform:capitalize; }
  .review-scroll{ flex:1; overflow-y:auto; position:relative; z-index:2; padding:2px 8px 8px 2px; }
  .pill-cloud{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .research-pill{ font-family:'Space Grotesk', sans-serif; font-size:12px; font-weight:700; background:var(--ink); color:#FFF; padding:7px 13px; border-radius:100px; text-transform:capitalize; }
  .pill-cloud-label{ font-family:'Space Grotesk', sans-serif; font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; opacity:.7; margin:10px 0 2px 0; }

  .verse-pick-list{ overflow-y:auto; flex:1; margin-top:0; position:relative; z-index:2; padding:2px 4px 4px 0; }
  .verse-tile{ display:flex; gap:9px; align-items:flex-start; padding:11px 8px; cursor:pointer; transition:background .13s ease; color:var(--ink); border-bottom:2px solid rgba(13,13,13,0.12); border-radius:10px; }
  .verse-tile:last-child{ border-bottom:none; }
  .verse-tile.selected{ background:var(--lime); }
  .verse-tile .vnum{ font-family:'Space Grotesk', sans-serif; font-weight:700; color:var(--purple); flex-shrink:0; width:22px; }
  .verse-tile .vtext{ font-size:13.5px; line-height:1.4; font-family:'Inter',sans-serif; font-weight:700; }

  .dark-scripture-card{ background:var(--ink); color:#FFF; border:3.5px solid var(--ink); border-radius:18px; padding:14px; box-shadow:4px 4px 0 rgba(0,0,0,0.25); flex-shrink:0; position:relative; z-index:2; }
  .dark-scripture-card .ref{ font-family:'Space Grotesk', sans-serif; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--lime); margin-bottom:4px; }
  .dark-scripture-card .vt{ font-style:normal; font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; line-height:1.4; opacity:.95; }

  /* LARGER CIRCLE HERO SLIDE */
  .circle-hero-container{ position:relative; z-index:2; flex-shrink:0; display:flex; justify-content:center; margin:12px 0 8px 0; }
  .circle-hero{ width:220px; height:220px; border-radius:50%; background:#FFF; color:var(--ink); border:4px solid var(--ink); box-shadow:5px 5px 0 var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:18px; flex-shrink:0; }
  .circle-hero .arc-stem-text{ font-family:'Space Grotesk', sans-serif; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:1px; opacity:.6; margin-bottom:6px; }
  .circle-hero .label-god-is{ font-family:'Space Grotesk', sans-serif; font-weight:800; font-size:26px; letter-spacing:-.5px; text-transform:uppercase; line-height:1; margin-bottom:10px; }
  .blank-input{ width:88%; border:none; border-bottom:3.5px solid var(--ink); background:transparent; font-family:'Inter', sans-serif; font-size:16px; font-weight:800; text-align:center; outline:none; color:var(--purple); padding:2px 0; transition:all .2s ease; }
  .blank-input.ghost{ color:rgba(13,13,29,.35); font-style:italic; }

  .inline-tip{ margin-top:8px; margin-bottom:4px; position:relative; z-index:2; flex-shrink:0; color:var(--ink); opacity:0; transform:translateY(6px); transition:all .25s ease; }
  .inline-tip.show{ opacity:1; transform:translateY(0); }
  .inline-tip .tip-text{ font-family:'Inter', sans-serif; font-size:12.5px; font-weight:700; line-height:1.4; }
  .inline-tip .tip-text b{ font-family:'Space Grotesk', sans-serif; font-weight:700; letter-spacing:.5px; }

  .breath-circle{ width:180px; height:180px; border-radius:50%; margin:26px auto; background:var(--purple); border:4px solid var(--ink); animation:breathe 5s ease-in-out infinite; position:relative; z-index:2; flex-shrink:0; }
  @keyframes breathe{ 0%,100%{ transform:scale(0.85); background:var(--purple); } 50%{ transform:scale(1.15); background:var(--lime); } }
  .breath-text{ font-family:'Inter', sans-serif; font-size:18.5px; font-weight:800; line-height:1.5; text-align:center; position:relative; z-index:2; max-width:340px; margin:0 auto; }

  .final-card{ background:#FFF; color:var(--ink); border:4px solid var(--ink); border-radius:22px; padding:18px; position:relative; z-index:2; overflow-y:auto; flex:1; box-shadow:5px 5px 0 var(--ink); display:flex; flex-direction:column; }
  .final-card .fhdr{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .final-card .fhdr .fbadge{ font-family:'Space Grotesk',sans-serif; font-size:9px; font-weight:700; background:var(--lime); border:2px solid var(--ink); padding:4px 10px; border-radius:100px; }
  .final-card .flabel{ font-family:'Space Grotesk', sans-serif; font-size:10.5px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase; color:#666; margin-bottom:5px; margin-top:13px; }
  .final-card .flabel:first-child{ margin-top:0; }
  .word-chip-list{ display:flex; flex-direction:column; gap:6px; }
  .word-chip{ font-family:'Inter', sans-serif; font-size:12.5px; font-weight:700; line-height:1.4; }
  .word-chip b{ text-transform:capitalize; color:var(--pink); }
  .challenge-box{ background:var(--yellow); border:3px solid var(--ink); border-radius:14px; padding:11px 13px; margin-top:6px; box-shadow:3px 3px 0 var(--ink); font-weight:700; }
  .export-btn{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; letter-spacing:.3px; text-transform:uppercase; background:var(--lime); color:var(--ink); border:4px solid var(--ink); border-radius:100px; padding:15px 0; width:100%; margin-top:16px; cursor:pointer; position:relative; z-index:2; flex-shrink:0; box-shadow:5px 5px 0 var(--ink); transition:all .15s ease; }

  /* BIBLE COVER CARDS */
  .leather-cover{ flex:1; display:flex; border-radius:20px; overflow:hidden; min-height:0; position:relative; border:4px solid var(--ink); box-shadow:6px 6px 0 var(--ink); background: radial-gradient(circle at 28% 18%, rgba(255,255,255,0.10), transparent 42%), repeating-linear-gradient(135deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 2px, transparent 2px, transparent 7px), linear-gradient(160deg, #7a4a2c, #452817); }
  .leather-spine{ width:16px; background:rgba(0,0,0,0.38); flex-shrink:0; border-right:2px solid rgba(0,0,0,0.3); }
  .leather-cover-inner{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px; color:#F1E3D3; text-align:center; }
  .leather-cover-inner .book-title{ color:#F1E3D3; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:30px; text-transform:uppercase; }

  .focus-pill{ border-radius:22px; padding:16px 20px; text-align:center; position:relative; z-index:2; }
  .focus-pill-label{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11.5px; letter-spacing:1.2px; text-transform:uppercase; opacity:.7; color:var(--ink); }
  .focus-pill-value{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; text-transform:uppercase; letter-spacing:.3px; color:var(--ink); margin-top:3px; }
  .focus-pill.yellow{ background:var(--yellow); }
  .focus-pill.lime{ background:var(--lime); }
  .cover-note{ font-family:'Inter', sans-serif; font-size:12.5px; font-weight:700; line-height:1.45; color:rgba(255,255,255,0.92); max-width:280px; }

  .scroll-more-hint{ position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:center; padding:10px 0 4px 0; pointer-events:none; opacity:1; transition:opacity .25s ease; background:linear-gradient(to bottom, transparent, var(--cream) 65%); }
  .scroll-more-hint.hide{ opacity:0; }
  .scroll-more-hint i{ font-size:16px; color:var(--ink); opacity:.55; animation:scrollBounce 1.4s ease-in-out infinite; }
  @keyframes scrollBounce{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(5px); } }
  .full-page{ flex:1; display:flex; flex-direction:column; min-height:0; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="hud-header">
    <div class="progress-container">
      <div class="progress-bar-fill" id="progressBarFill"></div>
      <div class="notches-layer" id="notchesLayer"></div>
    </div>
    <div class="story-meta"><span>MS Hang Prep</span><span>Mark 1:21–45</span></div>
  </div>
  <div class="stage" id="stage"></div>
</div>

<div id="exportTarget" style="position:fixed; left:-9999px; top:0; width:400px;"></div>

<script>
const passage = [
 "They went to Capernaum, and when the Sabbath came, Jesus went into the synagogue and began to teach.",
 "The people were amazed at his teaching, because he taught them as one who had authority, not as the teachers of the law.",
 "Just then a man in their synagogue who was possessed by an impure spirit cried out,",
 "\"What do you want with us, Jesus of Nazareth? Have you come to destroy us? I know who you are—the Holy One of God!\"",
 "\"Be quiet!\" said Jesus sternly. \"Come out of him!\"",

function quoteVerse(text){
  const t = (text||'').trim();
  const startsWithQuote = /^["“]/.test(t);
  const endsWithQuote = /["”]$/.test(t);
  return (startsWithQuote ? '' : '"') + text + (endsWithQuote ? '' : '"');
}
function normWord(w){ return w.replace(/[^a-zA-Z']/g,'').toLowerCase(); }

function kw(lines, extraClass){
  let i = 0;
  const body = lines.map(line=>{
    const words = line.map(w=>{
      const delay = (i * 0.09).toFixed(2); i++;
      return `<span class="kword" style="animation-delay:${delay}s">${w}</span>`;
    }).join(' ');
    return `<div class="kline">${words}</div>`;
  }).join('');
  return `<div class="hero-title${extraClass ? ' '+extraClass : ''}">${body}</div>`;
}

const paragraphEnds = [28, 31, 34, 39, 44, 45]; // verse indices mapped to NIV paragraph breaks

function passageWordsHTML(){
  let out = '<p class="flow-para">';
  passage.forEach((v,i)=>{
    const verseNum = i + 21;
    const words = v.split(/\s+/);
    const spans = words.map((w,wi)=>{
      const norm = normWord(w);
      const marker = wi === 0 ? `<span class="verse-num-inline">${verseNum}</span>` : '';
      return `${marker}<span class="w" data-word="${norm}" onclick="tapWord(event,this)">${w}</span>`;
    }).join(' ');
    out += spans + ' ';
    if (paragraphEnds.includes(verseNum) && verseNum !== 45) out += '</p><p class="flow-para">';
  });
  out += '</p>';
  return out;
}

function versePickHTML(){
  return passage.map((v,i)=>`
    <div class="verse-tile" data-v="${i+21}" onclick="pickCharVerse(event,${i+21})">
      <div class="vnum">${i+21}</div><div class="vtext">${v}</div>
    </div>`).join('');
}

function initNotches(){
  const layer = document.getElementById('notchesLayer');
  layer.innerHTML = '';
  const total = beats.length;
  beats.forEach((b, i) => {
    if (b.isInteractive) {
      const notch = document.createElement('div');
      notch.className = 'prog-notch';
      notch.id = `notch-${i}`;
      const pct = (i / (total - 1)) * 100;
      notch.style.left = `${pct}%`;
      layer.appendChild(notch);
    }
  });
}

function updateProgressBar(){
  const fill = document.getElementById('progressBarFill');
  const total = beats.length;
  const pct = (state.index / (total - 1)) * 100;
  fill.style.width = `${pct}%`;

  beats.forEach((b, i) => {
    if (b.isInteractive) {
      const notch = document.getElementById(`notch-${i}`);
      if (!notch) return;
      notch.classList.remove('passed', 'active');
      if (state.index > i) {
        notch.classList.add('passed');
      } else if (state.index === i) {
        notch.classList.add('active');
      }
    }
  });
}

let clueTimeout = null;

function triggerSelectionClue(){
  const b = beats[state.index];
  
  if (b.id === 'vocab-scan') {
    const pill = document.getElementById('vocabPill');
    const txt = document.getElementById('vocabPillText');
    if (pill && txt) {
      pill.classList.add('warn');
      txt.textContent = state.wordTaps.length === 0 ? 'Flag a word to continue!' : 'Scroll to the bottom!';
      setTimeout(() => { pill.classList.remove('warn'); updateWordUI(); }, 1800);
      return;
    }
  }

  if (b.id === 'char-verse-pick') {
    const pill = document.getElementById('charPill');
    const txt = document.getElementById('charPillText');
    if (pill && txt) {
      pill.classList.add('warn');
      txt.textContent = 'Tap a verse to select!';
      setTimeout(() => { pill.classList.remove('warn'); updateCharPill(); }, 1800);
      return;
    }
  }

  const activeBeatEl = document.getElementById(`beat-${state.index}`);
  const hintBox = activeBeatEl ? activeBeatEl.querySelector('.tap-hint') : null;
  if (!hintBox) return;

  const clueText = b.clue || 'Make a selection';
  hintBox.innerHTML = `<span class="clue-badge"><i class="fa-solid fa-hand-pointer"></i> ${clueText}</span>`;

  clearTimeout(clueTimeout);
  clueTimeout = setTimeout(() => {
    resetArrows();
  }, 2000);
}

function resetArrows(){
  const activeBeatEl = document.getElementById(`beat-${state.index}`);
  const hintBox = activeBeatEl ? activeBeatEl.querySelector('.tap-hint') : null;
  if (!hintBox) return;

  if (state.index === 0) {
    hintBox.innerHTML = `<div class="swipe-hint"><i class="fa-solid fa-chevron-left"></i><i class="fa-solid fa-chevron-right"></i></div>
    <div class="nav-subtle-caption">&lt; Swipe to navigate &gt;</div>`;
  } else {
    hintBox.innerHTML = `<div class="swipe-hint"><i class="fa-solid fa-chevron-left"></i><i class="fa-solid fa-chevron-right"></i></div>`;
  }
}

function renderBeat(i){
  document.querySelectorAll('.beat').forEach(el=>el.classList.remove('active'));
  document.getElementById(`beat-${i}`).classList.add('active');
  renderGen++;
  stopGhostCycle();
  const b = beats[i];

  phoneEl.style.background = b.bgGrad;
  document.querySelector('.hud-header').className = 'hud-header ' + (b.text === 'light' ? 'tx-light' : 'tx-dark');

  resetArrows();

  if (b.id === 'char-coaching') {
    const activeVerse = state.charVerse || 21;
    document.getElementById('charRef').textContent = 'Mark 1:' + activeVerse;
    document.getElementById('charText').textContent = quoteVerse(passage[activeVerse-21]);

    const arcStem = document.getElementById('arcStemText');
    if (arcStem) arcStem.textContent = `BASED ON VERSE ${activeVerse}:`;

    const inp = document.getElementById('customTraitInput');
    if (inp) {
      if (state.trait && state.trait.trim()) {
        inp.value = state.trait;
        inp.classList.remove('ghost');
        stopGhostCycle();
      } else {
        inp.value = 'e.g. ' + ghostExamples[0];
        inp.classList.add('ghost');
        startGhostCycle();
      }
    }
    document.getElementById('coachBox').classList.toggle('show', !!(state.trait && state.trait.trim()));
  } else if (b.id === 'char-verse-pick') {
    document.querySelectorAll('#beat-'+i+' .verse-tile').forEach(t=>t.classList.toggle('selected', state.charVerse !== null && Number(t.dataset.v)===state.charVerse));
    updateCharPill();
  } else if (b.id === 'vocab-scan') {
    updateWordUI();
    checkPassageScroll();
  }

  if (b.id === 'final') fillFinal();
  if (b.id === 'vocab-review') renderVocabReview();

  updateProgressBar();
}

const answeredBeats = new Set();

function questAnswer(e, el, gridId, fbId, correctMsg, wrongMsg){
  e.stopPropagation();
  if (el.classList.contains('locked')) return;
  const isCorrect = el.dataset.correct === 'true';
  const fb = document.getElementById(fbId);
  if (isCorrect) {
    const grid = document.getElementById(gridId);
    grid.querySelectorAll('.quiz-tile').forEach(t=>t.classList.add('locked'));
    el.classList.add('correct');
    answeredBeats.add(state.index);
    if (fb) { fb.textContent = correctMsg; fb.classList.remove('bad'); fb.classList.add('good','show'); }
    const myGen = renderGen;
    setTimeout(()=>{ if (renderGen === myGen) goNext(); }, 900);
  } else {
    el.classList.add('incorrect','shake');
    if (fb) { fb.textContent = wrongMsg; fb.classList.remove('good'); fb.classList.add('bad','show'); }
    setTimeout(()=>{ el.classList.remove('shake','incorrect'); }, 500);
  }
}

let popTimer = null;
function tapWord(e, el){
  e.stopPropagation();
  const word = el.dataset.word;
  if (!word) return;
  const already = el.classList.contains('flagged');
  if (already) {
    el.classList.remove('flagged');
    state.wordTaps = state.wordTaps.filter(w => w.el !== el);
    hideDefPopover();
  } else {
    const def = defs[word] || null;
    el.classList.add('flagged');
    state.wordTaps.push({ el, word, def });
    if (def) showDefPopover(el, word, def); else hideDefPopover();
  }
  updateWordUI();
}

function showDefPopover(el, word, def){
  const pop = document.getElementById('defPopover');
  const wrapEl = pop ? pop.closest('.passage-scroll-wrap') : null;
  if (!pop || !wrapEl) return;
  pop.innerHTML = `<span class="dp-word">${word}</span>${def}`;
  const wordRect = el.getBoundingClientRect();
  const wrapRect = wrapEl.getBoundingClientRect();
  const popWidth = 230;
  let left = (wordRect.left - wrapRect.left) - 10;
  left = Math.max(8, Math.min(left, wrapRect.width - popWidth - 8));
  let top = (wordRect.bottom - wrapRect.top) + 8;
  pop.style.left = left + 'px';
  pop.style.top = Math.max(4, top) + 'px';
  pop.classList.add('show');
  clearTimeout(popTimer);
  popTimer = setTimeout(hideDefPopover, 2800);
}

function hideDefPopover(){
  clearTimeout(popTimer);
  const pop = document.getElementById('defPopover');
  if (pop) pop.classList.remove('show');
}

function updateWordUI(){ checkVocabComplete(); }

function checkVocabComplete(){
  const pill = document.getElementById('vocabPill');
  const textEl = document.getElementById('vocabPillText');
  if (!pill || !textEl) return;
  const hasWord = state.wordTaps.length > 0;
  const ready = hasWord && state.scrolledToEnd;
  pill.classList.toggle('ready', ready);
  if (ready) {
    textEl.innerHTML = '<i class="fa-solid fa-check"></i> Continue';
  } else {
    const n = state.wordTaps.length;
    textEl.textContent = n > 0 ? `${n} word${n===1?'':'s'} flagged` : 'Flag Key Words';
  }
}

function tryAdvanceVocab(){
  if (state.wordTaps.length > 0 && state.scrolledToEnd) goNext();
  else triggerSelectionClue();
}

function checkPassageScroll(){
  const el = document.getElementById('passageScrollEl');
  const hint = document.getElementById('scrollMoreHint');
  const fill = document.getElementById('readProgressFill');
  if (!el) return;
  hideDefPopover();
  const maxScroll = el.scrollHeight - el.clientHeight;
  const pct = maxScroll > 0 ? Math.min(100, Math.max(0, (el.scrollTop / maxScroll) * 100)) : 100;
  if (fill) fill.style.width = pct + '%';
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
  if (atBottom && !state.scrolledToEnd) {
    state.scrolledToEnd = true;
    checkVocabComplete();
  }
  if (hint) hint.classList.toggle('hide', atBottom);
}

function renderVocabReview(){
  const box = document.getElementById('vocabReviewBox');
  if (state.wordTaps.length === 0) {
    box.innerHTML = `<div class="review-card">No words flagged!</div>`;
    return;
  }
  const defined = state.wordTaps.filter(w => w.def);
  const undefinedWords = state.wordTaps.filter(w => !w.def);
  let html = defined.map(w => `<div class="review-card"><b>${w.word}:</b> ${w.def}</div>`).join('');
  if (undefinedWords.length > 0) {
    html += `<div class="pill-cloud-label">Look up before Sunday</div>
             <div class="pill-cloud">${undefinedWords.map(w => `<div class="research-pill">${w.word}</div>`).join('')}</div>`;
  }
  box.innerHTML = html;
}

    textEl.textContent = "Spot a God Shot";

}

let ghostCycleTimer = null;
let ghostCycleIndex = 0;

function startGhostCycle(){
  stopGhostCycle();
  ghostCycleIndex = 0;
  const myGen = renderGen;
  ghostCycleTimer = setInterval(()=>{
    if (renderGen !== myGen) { stopGhostCycle(); return; }
    const inp = document.getElementById('customTraitInput');
    if (!inp || !inp.classList.contains('ghost')) { stopGhostCycle(); return; }
    ghostCycleIndex = (ghostCycleIndex + 1) % ghostExamples.length;
    inp.value = 'e.g. ' + ghostExamples[ghostCycleIndex];
  }, 2200);
}

function stopGhostCycle(){
  if (ghostCycleTimer) { clearInterval(ghostCycleTimer); ghostCycleTimer = null; }
}

function handleBlankFocus(inp){
  if (inp.classList.contains('ghost')) {
    inp.value = '';
    inp.classList.remove('ghost');
    stopGhostCycle();
  }
}

function handleCustomTrait(val){
  state.trait = val;
  const box = document.getElementById('coachBox');
  const hasContent = !!(val && val.trim());
  if (box) box.classList.toggle('show', hasContent);
}

function fillFinal(){
  const list = document.getElementById('finalWords');
  if (state.wordTaps.length === 0) {
    list.innerHTML = `<div class="word-chip">No words flagged.</div>`;
  } else {
    const limitedTaps = state.wordTaps.slice(0, 3);
    list.innerHTML = limitedTaps.map(w=>{
      const d = w.def || 'Look up definition before group.';
      return `<div class="word-chip"><b>${w.word}</b> — ${d}</div>`;
    }).join('');
  }
  const fv = document.getElementById('finalVerse');
  if (state.charVerse) {
    fv.innerHTML = `<b>Mark 1:${state.charVerse}</b> — ${quoteVerse(passage[state.charVerse-21])}`;
  } else {
    fv.textContent = 'No verse selected.';
  }
  const trait = state.trait && state.trait.trim() ? state.trait.trim() : 'Holy';
  document.getElementById('finalChallenge').innerHTML = `<em>"Therefore, place your faith in Him when battling lies, the enemy, or illness because God is ${trait}."</em>`;
}

function goNext(){
  const b = beats[state.index];
  if (b.blockTap) {
    if (b.id === 'quest-demons' && !answeredBeats.has(state.index)) {
      triggerSelectionClue();
      return;
    }
    if (b.id === 'vocab-scan' && (!state.wordTaps.length || !state.scrolledToEnd)) {
      triggerSelectionClue();
      return;
    }
    if (b.id === 'char-verse-pick' && state.charVerse === null) {
      triggerSelectionClue();
      return;
    }
    if (b.id === 'char-coaching' && !(state.trait && state.trait.trim())) {
      triggerSelectionClue();
      return;
    }
  }
  if (state.index < beats.length - 1) {
    const nextBeat = beats[state.index + 1];
    const isFlipPair = (b.id === 'reading-intro' && nextBeat.id === 'vocab-scan') ||
                        (b.id === 'character-prompt' && nextBeat.id === 'char-verse-pick');
    if (isFlipPair) {
      const curEl = document.getElementById('beat-' + state.index);
      if (curEl) {
        curEl.classList.add('page-flip-out');
        setTimeout(()=>{ curEl.classList.remove('page-flip-out'); }, 650);
      }
    }
    state.index++; renderBeat(state.index);
  }
}

function goPrev(){ if (state.index > 0) { state.index--; renderBeat(state.index); } }

/* KEYBOARD NAVIGATION (DESKTOP ARROW KEYS) */
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goNext();
  if (e.key === 'ArrowLeft') goPrev();
});

/* SWIPE NAVIGATION (TOUCH & MOUSE DRAG) */
let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
const stageEl = document.getElementById('stage');

stageEl.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchStartTime = Date.now();
}, { passive: true });

stageEl.addEventListener('touchend', (e) => {
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const dt = Date.now() - touchStartTime;
  
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && dt < 500) {
    if (dx < 0) goNext();
    else goPrev();
  }
}, { passive: true });

let mouseStartX = 0, mouseStartY = 0, mouseIsDown = false;

stageEl.addEventListener('mousedown', (e) => {
  if (['INPUT', 'BUTTON', 'TEXTAREA'].includes(e.target.tagName) || e.target.closest('.quiz-tile, .verse-tile, .w, .focus-pill-dock')) return;
  mouseIsDown = true;
  mouseStartX = e.clientX;
  mouseStartY = e.clientY;
});

stageEl.addEventListener('mouseup', (e) => {
  if (!mouseIsDown) return;
  mouseIsDown = false;
  const dx = e.clientX - mouseStartX;
  const dy = e.clientY - mouseStartY;
  
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    if (dx < 0) goNext();
    else goPrev();
  }
});
